<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythical Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#grid{width:min(94vw,440px);display:grid;grid-template-columns:repeat(2,1fr);gap:0;box-sizing:border-box}
.card{position:relative;width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.card .base,.card .fruit{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.card .base{filter:drop-shadow(0 3px 7px rgba(0,0,0,.16))}
/* Chỉ phần trái ác quỷ/đồ vật bên trong chuyển động nhẹ */
.fruit-window{position:absolute;left:15%;right:15%;top:25%;bottom:15%;overflow:hidden;pointer-events:none}
.card.control .fruit-window{left:13%;right:13%;top:24%;bottom:14%}
.card .fruit{transform-origin:center center;opacity:.98;will-change:transform;animation-name: fruitBob, fruitSway;animation-timing-function:ease-in-out,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:alternate,alternate}
.card.magnet .fruit{animation-duration:1.9s,2.8s;animation-delay:0s,.15s}
.card.dragon .fruit{animation-duration:2.1s,3.0s;animation-delay:.25s,.45s}
.card.kitsune .fruit{animation-duration:2.0s,2.7s;animation-delay:.55s,.2s}
.card.control .fruit{animation-duration:2.2s,3.2s;animation-delay:.1s,.6s}
@keyframes fruitBob{
  0%{transform:translateY(2px) scale(1.03)}
  100%{transform:translateY(-5px) scale(1.05)}
}
@keyframes fruitSway{
  0%{rotate:-1.8deg}
  100%{rotate:1.8deg}
}
</style></head><body><div id="grid"></div>
<script>
const TOPIC="mythical-overlay-7f4c9d2a8b6e1c53";
const items=[["magnet","magnet.png"],["dragon","dragon.png"],["kitsune","kitsune.png"],["control","control.png"]];
let state={magnet:true,dragon:true,kitsune:true,control:true};
function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  for(const [id,file] of items){
    if(!state[id]) continue;
    const card=document.createElement('div');
    card.className='card '+id;
    const base=document.createElement('img');
    base.className='base';
    base.src=file+'?v=6';
    base.alt=id;
    const win=document.createElement('div');
    win.className='fruit-window';
    const fruit=document.createElement('img');
    fruit.className='fruit';
    fruit.src=file+'?v=6';
    fruit.alt='moving '+id;
    win.appendChild(fruit);
    card.appendChild(base);
    card.appendChild(win);
    grid.appendChild(card);
  }
}
function apply(x){try{x=JSON.parse(x);if(x&&typeof x==='object'){state={...state,...x};render()}}catch(e){}}
try{
  const es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event==='message')apply(d.message)}catch(err){}};
}catch(e){}
render();
</script></body></html>
