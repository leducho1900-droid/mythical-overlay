<!doctype html><html lang="vi"><head><link rel="icon" href="favicon.ico?v=43"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Overlay V43</title><style>html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(96vw,760px);padding:4px;box-sizing:border-box}#wrap.seven{width:min(96vw,760px,calc((96vh - 20px)*355/406 + 20px))}.row{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:0 0 10px}.row:last-child{margin-bottom:0}.card{position:relative;flex:0 0 calc((100% - 20px)/3);max-width:170px;aspect-ratio:355/406;overflow:visible}.row[data-count="2"] .card{flex-basis:calc((100% - 10px)/2);max-width:170px}.row[data-count="1"] .card{flex-basis:170px;max-width:170px}.base,.float-wrap,.obj{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}.base,.obj{object-fit:contain}.float-wrap{transform:translateZ(0);backface-visibility:hidden;perspective:1000px}.obj{transform-origin:center 69%;will-change:transform;backface-visibility:hidden;transform:translate3d(0,0,0) scale(.97);animation:breathe 3.6s cubic-bezier(.45,.05,.55,.95) infinite}.card.tiger .obj,.card.yeti .obj,.card.chest .obj{transform-origin:center 72%}.card.magnet .obj{animation-delay:-.15s}.card.dragon .obj{animation-delay:-.75s}.card.tiger .obj{animation-delay:-1.35s}.card.kitsune .obj{animation-delay:-1.95s}.card.control .obj{animation-delay:-2.55s}.card.yeti .obj{animation-delay:-3.15s}.card.chest .obj{animation-delay:-2.85s}@keyframes breathe{0%,100%{transform:translate3d(0,0,0) scale(.97)}50%{transform:translate3d(0,-1px,0) scale(1.035)}}</style></head><body><div id="wrap"></div><script>const BACKEND_URL='https://mythical-overlay-backend.leducho1900.workers.dev';const room=new URLSearchParams(location.search).get('room')||'';const items=[['magnet','magnet_base.png','magnet_obj.png'],['dragon','dragon_base.png','dragon_obj.png'],['tiger','tiger_base.png','tiger_obj.png'],['kitsune','kitsune_base.png','kitsune_obj.png'],['control','control_base.png','control_obj.png'],['yeti','yeti_base.png','yeti_obj.png'],['chest','chest_base.png','chest_obj.png']];let state={magnet:true,dragon:true,tiger:true,kitsune:true,control:true,yeti:true,chest:true};function split(a){const n=a.length;if(!n)return[];if(n<=2)return[a];if(n===3)return[a.slice(0,2),a.slice(2)];if(n===4)return[a.slice(0,2),a.slice(2)];if(n===5)return[a.slice(0,3),a.slice(3)];if(n===6)return[a.slice(0,3),a.slice(3,6)];return[a.slice(0,3),a.slice(3,6),a.slice(6,7)]}function render(){const w=document.getElementById('wrap');if(!room){w.innerHTML='';return}const v=items.filter(([id])=>state[id]);w.classList.toggle('seven',v.length===7);w.innerHTML='';split(v).forEach(g=>{const r=document.createElement('div');r.className='row';r.dataset.count=g.length;g.forEach(([id,b,o])=>{const c=document.createElement('div');c.className='card '+id;c.innerHTML=`<img class="base" src="${b}?v=43"><div class="float-wrap"><img class="obj" src="${o}?v=43"></div>`;r.appendChild(c)});w.appendChild(r)})}async function sync(){if(!room)return;try{const r=await fetch(BACKEND_URL+'/state?room='+encodeURIComponent(room)+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const x=await r.json();if(x.state){const n={...state,...x.state};const ch=items.some(([id])=>n[id]!==state[id]);state=n;if(ch)render()}}catch(e){}}render();sync();setInterval(sync,900);</script></body></html>
