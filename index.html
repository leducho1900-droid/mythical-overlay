<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythical Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#grid{width:min(94vw,440px);display:grid;grid-template-columns:repeat(2,1fr);gap:0;box-sizing:border-box}
.card{position:relative;width:100%;aspect-ratio:355/406;display:flex;align-items:center;justify-content:center}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.obj-wrap{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);pointer-events:none}
.obj{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));transform-origin:center center;animation: bob 1.9s ease-in-out infinite alternate, sway 2.9s ease-in-out infinite alternate}
.card.magnet .obj-wrap{width:70%}
.card.dragon .obj-wrap{width:76%}
.card.kitsune .obj-wrap{width:72%}
.card.control .obj-wrap{width:72%}
.card.magnet .obj{animation-delay:0s,.2s}
.card.dragon .obj{animation-delay:.2s,.45s}
.card.kitsune .obj{animation-delay:.45s,.1s}
.card.control .obj{animation-delay:.1s,.6s}
@keyframes bob{0%{transform:translateY(2px) scale(1)}100%{transform:translateY(-4px) scale(1.015)}}
@keyframes sway{0%{rotate:-1.6deg}100%{rotate:1.6deg}}
</style></head><body><div id="grid"></div>
<script>
const TOPIC='mythical-overlay-7f4c9d2a8b6e1c53';
const items=[
  ['magnet','magnet.png','magnet_obj.png'],
  ['dragon','dragon.png','dragon_obj.png'],
  ['kitsune','kitsune.png','kitsune_obj.png'],
  ['control','control.png','control_obj.png']
];
let state={magnet:true,dragon:true,kitsune:true,control:true};
function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  for(const [id,baseSrc,objSrc] of items){
    if(!state[id]) continue;
    const card=document.createElement('div');
    card.className='card '+id;
    const base=document.createElement('img');
    base.className='base';
    base.src=baseSrc+'?v=7';
    const wrap=document.createElement('div');
    wrap.className='obj-wrap';
    const obj=document.createElement('img');
    obj.className='obj';
    obj.src=objSrc+'?v=7';
    wrap.appendChild(obj);
    card.appendChild(base);
    card.appendChild(wrap);
    grid.appendChild(card);
  }
}
function apply(x){try{x=JSON.parse(x);if(x&&typeof x==='object'){state={...state,...x};render()}}catch(e){}}
try{const es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event==='message')apply(d.message)}catch(err){}}}catch(e){}
render();
</script></body></html>
