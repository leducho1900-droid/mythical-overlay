<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Overlay V52</title><style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}body{display:flex;align-items:center;justify-content:center}
#wrap{--cw:min(150px,calc((96vh - 26px)/4.5));width:calc(var(--cw)*3 + 20px);max-width:96vw;padding:2px;box-sizing:border-box}.row{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:0 0 10px}.row:last-child{margin-bottom:0}
.card{position:relative;width:var(--cw);aspect-ratio:355/406;border-radius:18px;padding:5px;overflow:hidden;box-sizing:border-box;background:linear-gradient(90deg,#ff2d55,#ff9500,#ffd60a,#32d74b,#64d2ff,#0a84ff,#bf5af2,#ff2d55);background-size:500% 100%;animation:rainbow 4s linear infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.30))}.card:nth-child(2){animation-delay:-1.3s}.card:nth-child(3){animation-delay:-2.6s}
.stage{position:relative;width:100%;height:100%;overflow:hidden;border-radius:13px;background:#faefe2}.base,.pet{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}.base{z-index:1}.pet{z-index:2;will-change:transform,opacity;transform-origin:center 69%}
.pair .pet.a{animation:swapA 5.2s cubic-bezier(.4,0,.2,1) infinite}.pair .pet.b{animation:swapB 5.2s cubic-bezier(.4,0,.2,1) infinite}.chest .pet.a{animation:chestPulse 3.4s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes rainbow{0%{background-position:0% 50%}100%{background-position:500% 50%}}
@keyframes swapA{0%,38%{transform:scale(1);opacity:1}44%{transform:scale(.06);opacity:0}44.01%,94%{transform:scale(.06);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes swapB{0%,44%{transform:scale(.06);opacity:0}50%{transform:scale(1);opacity:1}88%{transform:scale(1);opacity:1}94%{transform:scale(.06);opacity:0}100%{transform:scale(.06);opacity:0}}
@keyframes chestPulse{0%,100%{transform:scale(.97)}50%{transform:scale(1.025)}}
</style></head><body><div id="wrap"></div><script>
const BACKEND_URL='https://mythical-overlay-backend.leducho1900.workers.dev';const room=new URLSearchParams(location.search).get('room')||'';
const items=[['magnet','magnet_base.png','magnet_a.png','magnet_b.png'],['dragon','dragon_base.png','dragon_a.png','dragon_b.png'],['tiger','tiger_base.png','tiger_a.png','tiger_b.png'],['kitsune','kitsune_base.png','kitsune_a.png','kitsune_b.png'],['control','control_base.png','control_a.png','control_b.png'],['yeti','yeti_base.png','yeti_a.png','yeti_b.png'],['chest','chest_base.png','chest_obj.png',null]];
let state={magnet:true,dragon:true,tiger:true,kitsune:true,control:true,yeti:true,chest:true};
function split(a){const n=a.length;if(!n)return[];if(n<=2)return[a];if(n===3)return[a.slice(0,2),a.slice(2)];if(n===4)return[a.slice(0,2),a.slice(2)];if(n===5)return[a.slice(0,3),a.slice(3)];if(n===6)return[a.slice(0,3),a.slice(3,6)];return[a.slice(0,3),a.slice(3,6),a.slice(6,7)]}
function render(){const w=document.getElementById('wrap');if(!room){w.innerHTML='';return}const vis=items.filter(([id])=>state[id]);w.innerHTML='';split(vis).forEach(g=>{const r=document.createElement('div');r.className='row';g.forEach(([id,base,a,b])=>{const c=document.createElement('div');c.className='card '+(b?'pair':'chest')+' '+id;const st=document.createElement('div');st.className='stage';st.innerHTML=`<img class="base" src="${base}?v=52"><img class="pet a" src="${a}?v=52">${b?`<img class="pet b" src="${b}?v=52">`:''}`;c.appendChild(st);r.appendChild(c)});w.appendChild(r)})}
async function sync(){if(!room)return;try{const r=await fetch(BACKEND_URL+'/state?room='+encodeURIComponent(room)+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const x=await r.json();if(x.state){const n={...state,...x.state};const ch=items.some(([id])=>n[id]!==state[id]);state=n;if(ch)render()}}catch(e){}}
render();sync();setInterval(sync,900);
</script></body></html>
