<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#grid{width:min(96vw,720px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px;box-sizing:border-box;padding:4px}
.card{position:relative;flex:0 0 calc((100% - 20px)/3);max-width:170px;aspect-ratio:355/406;overflow:visible}
.base,.float-wrap,.obj{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}.base,.obj{object-fit:contain}
.float-wrap{will-change:transform;animation:floatY 2.8s cubic-bezier(.45,.05,.55,.95) infinite alternate}
.obj{transform-origin:center 68%;will-change:transform;animation:drift 4.2s cubic-bezier(.42,0,.58,1) infinite alternate}
.card.magnet .float-wrap{animation-delay:0s}.card.magnet .obj{animation-delay:.1s}
.card.dragon .float-wrap{animation-delay:.35s}.card.dragon .obj{animation-delay:.5s}
.card.fox .float-wrap{animation-delay:.52s}.card.fox .obj{animation-delay:.35s}
.card.kitsune .float-wrap{animation-delay:.75s}.card.kitsune .obj{animation-delay:.2s}
.card.control .float-wrap{animation-delay:.18s}.card.control .obj{animation-delay:.65s}
.card.frost .float-wrap{animation-delay:.9s}.card.frost .obj{animation-delay:.8s}
@keyframes floatY{0%{transform:translateY(2px)}100%{transform:translateY(-3px)}}
@keyframes drift{0%{transform:translateX(-1px) rotate(-.45deg) scale(1)}50%{transform:translateX(0) rotate(0deg) scale(1.005)}100%{transform:translateX(1px) rotate(.45deg) scale(1.01)}}
</style></head><body><div id="grid"></div>
<script>
const TOPIC='mythical-overlay-7f4c9d2a8b6e1c53';
const items=[['magnet','magnet_base.png','magnet_obj.png'],['dragon','dragon_base.png','dragon_obj.png'],['fox','fox_base.png','fox_obj.png'],['kitsune','kitsune_base.png','kitsune_obj.png'],['control','control_base.png','control_obj.png'],['frost','frost_base.png','frost_obj.png']];
let state={magnet:true,dragon:true,fox:true,kitsune:true,control:true,frost:true};
function render(){const grid=document.getElementById('grid');const visible=items.filter(([id])=>state[id]);grid.innerHTML='';visible.forEach(([id,baseSrc,objSrc])=>{const card=document.createElement('div');card.className='card '+id;const base=document.createElement('img');base.className='base';base.src=baseSrc+'?v=14';const wrap=document.createElement('div');wrap.className='float-wrap';const obj=document.createElement('img');obj.className='obj';obj.src=objSrc+'?v=14';wrap.appendChild(obj);card.appendChild(base);card.appendChild(wrap);grid.appendChild(card);});}
function apply(x){try{x=JSON.parse(x);if(x&&typeof x==='object'){state={...state,...x};render()}}catch(e){}}
try{const es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event==='message')apply(d.message)}catch(err){}};}catch(e){}
render();
</script></body></html>
