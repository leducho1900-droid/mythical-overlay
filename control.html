<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Overlay Control V30</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:18px}.wrap{max-width:620px;margin:auto}h1{margin:0 0 6px;font-size:25px}p{color:#bbb}.row{display:flex;align-items:center;justify-content:space-between;background:#202020;border-radius:12px;padding:12px 14px;margin:9px 0}.name{font-weight:700}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}.on{background:#31d158;color:#061007}.off{background:#ff453a;color:#fff}.copy{background:#0a84ff;color:#fff}.all{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.status{background:#191919;border:1px solid #333;padding:10px;border-radius:9px;color:#bbb;font-size:13px}.login{background:#202020;padding:14px;border-radius:12px;margin-bottom:14px}.login input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;margin:8px 0}.locked{display:none}.hint{font-size:13px;line-height:1.5}</style></head>
<body><div class="wrap"><h1>🔐 Mythical Control V30</h1><div class="login"><div>Nhập key điều khiển</div><input id="key" type="password" placeholder="Key của bạn"><button class="btn copy" onclick="login()">Mở điều khiển</button></div><div id="panel" class="locked"><div id="controls"></div><div class="all"><button class="btn on" onclick="setAll(true)">Bật tất cả</button><button class="btn off" onclick="setAll(false)">Tắt tất cả</button><button class="btn copy" onclick="copyLink()">📋 Copy Overlay Link</button></div></div><div class="status" id="status">Chưa đăng nhập.</div><p class="hint">Key không nằm trong file HTML. Người có link Control nhưng không có key sẽ không điều khiển được.</p></div>
<script>
const BACKEND_URL='https://mythical-overlay-backend.leducho1900.workers.dev';
const items=[['magnet','🧲 Mythical Magnet'],['dragon','🐉 Mythical Dragon'],['tiger','🐯 Mythical Tiger'],['kitsune','🦊 Mythical Kitsune'],['control','🔵 Mythical Control'],['yeti','❄️ Mythical Yeti']];
let key='';let s={magnet:true,dragon:true,tiger:true,kitsune:true,control:true,yeti:true};
function render(){document.getElementById('controls').innerHTML=items.map(([id,n])=>`<div class="row"><span class="name">${n}</span><button class="btn ${s[id]?'on':'off'}" onclick="toggle('${id}')">${s[id]?'ĐANG BẬT':'ĐANG TẮT'}</button></div>`).join('')}
async function login(){key=document.getElementById('key').value.trim();if(!key)return;try{const r=await fetch(BACKEND_URL+'/verify',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Key':key}});if(!r.ok)throw 0;const data=await r.json();if(data.state)s={...s,...data.state};document.getElementById('panel').style.display='block';document.getElementById('status').textContent='✅ Đã đăng nhập';render()}catch(e){key='';document.getElementById('status').textContent='❌ Key sai hoặc backend chưa cấu hình'}}
async function send(){const r=await fetch(BACKEND_URL+'/state',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Key':key},body:JSON.stringify({state:s})});if(!r.ok)throw new Error();document.getElementById('status').textContent='✅ Đã gửi lệnh tới Overlay'}
async function toggle(id){s[id]=!s[id];render();try{await send()}catch(e){document.getElementById('status').textContent='❌ Không gửi được lệnh / key không hợp lệ'}}
async function setAll(v){s={magnet:v,dragon:v,tiger:v,kitsune:v,control:v,yeti:v};render();try{await send()}catch(e){document.getElementById('status').textContent='❌ Không gửi được lệnh / key không hợp lệ'}}
function overlayUrl(){return location.origin+location.pathname.replace(/control\.html$/,'')+'?v=30'}
async function copyLink(){const u=overlayUrl();try{await navigator.clipboard.writeText(u);document.getElementById('status').textContent='📋 Đã copy link Overlay'}catch(e){prompt('Copy link Overlay:',u)}}
</script></body></html>
