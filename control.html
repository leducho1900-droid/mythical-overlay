<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Control V34B</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:18px}.wrap{max-width:760px;margin:auto}h1{margin:0 0 8px;font-size:28px}h2{margin:0 0 8px;font-size:20px}.section{background:#181818;border:1px solid #303030;border-radius:15px;padding:14px;margin:14px 0}.sub{color:#aaa;font-size:13px;margin-bottom:8px}.row{display:flex;align-items:center;justify-content:space-between;background:#202020;border-radius:12px;padding:12px 14px;margin:9px 0;gap:10px}.name{font-weight:700}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}.on{background:#31d158;color:#061007}.off{background:#ff453a;color:#fff}.copy{background:#0a84ff;color:#fff}.all{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{background:#191919;border:1px solid #333;padding:10px;border-radius:9px;color:#bbb;font-size:13px}.login{background:#202020;padding:14px;border-radius:12px;margin-bottom:14px}.login input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;margin:8px 0}.locked{display:none}.hint{color:#aaa;font-size:13px;line-height:1.5}@media(max-width:620px){.row{flex-direction:column;align-items:stretch}.row .btn,.all .btn{width:100%}}
</style></head><body><div class="wrap">
<h1>🔐 Mythical Control V34B</h1>
<div class="login"><div>Nhập key điều khiển</div><input id="key" type="password" placeholder="Key của bạn"><button class="btn copy" onclick="login()">Mở điều khiển</button></div>
<div id="panel" class="locked">
  <div class="section"><h2>🎴 Overlay Pet</h2><div id="petControls"></div><div class="all"><button class="btn on" onclick="setGroup('pet',true)">Bật tất cả pet</button><button class="btn off" onclick="setGroup('pet',false)">Tắt tất cả pet</button><button class="btn copy" onclick="copyPetLink()">📋 Sao chép link Pet</button></div></div>
  <div class="section"><h2>✨ Overlay Chữ</h2><div class="sub">Chỉ có chữ nền trong suốt + hiệu ứng ánh sáng lướt qua.</div><div id="textControls"></div><div class="all"><button class="btn on" onclick="setGroup('text',true)">Bật tất cả chữ</button><button class="btn off" onclick="setGroup('text',false)">Tắt tất cả chữ</button><button class="btn copy" onclick="copyTextLink()">📋 Sao chép link Chữ</button></div></div>
</div>
<div class="status" id="status">Chưa đăng nhập.</div><p class="hint">Overlay Pet và Overlay Chữ là 2 link riêng nhưng dùng chung trang điều khiển và key.</p>
</div><script>
const BACKEND_URL='https://mythical-overlay-backend.leducho1900.workers.dev';
const petItems=[['magnet','🧲 Mythical Magnet'],['dragon','🐉 Mythical Dragon'],['tiger','🐯 Mythical Tiger'],['kitsune','🦊 Mythical Kitsune'],['control','🔵 Mythical Control'],['yeti','❄️ Mythical Yeti']];
const textItems=[['text_3in1','3 IN 1'],['text_4in1','4 IN 1'],['text_5in1','5 IN 1'],['text_6in1','6 IN 1']];
let key='';let s={magnet:true,dragon:true,tiger:true,kitsune:true,control:true,yeti:true,text_3in1:false,text_4in1:false,text_5in1:false,text_6in1:false};
function row(id,n){return `<div class="row"><span class="name">${n}</span><button class="btn ${s[id]?'on':'off'}" onclick="toggle('${id}')">${s[id]?'ĐANG BẬT':'ĐANG TẮT'}</button></div>`}
function render(){document.getElementById('petControls').innerHTML=petItems.map(([id,n])=>row(id,n)).join('');document.getElementById('textControls').innerHTML=textItems.map(([id,n])=>row(id,n)).join('')}
async function login(){key=document.getElementById('key').value.trim();if(!key)return;try{const r=await fetch(BACKEND_URL+'/verify',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Key':key}});if(!r.ok)throw 0;const d=await r.json();if(d.state)s={...s,...d.state};document.getElementById('panel').style.display='block';document.getElementById('status').textContent='✅ Đã đăng nhập';render()}catch(e){key='';document.getElementById('status').textContent='❌ Key sai hoặc backend chưa cấu hình'}}
async function send(){const r=await fetch(BACKEND_URL+'/state',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Key':key},body:JSON.stringify({state:s})});if(!r.ok)throw new Error();const d=await r.json();if(d.state)s={...s,...d.state};document.getElementById('status').textContent='✅ Đã gửi lệnh tới Overlay'}
async function toggle(id){s[id]=!s[id];render();try{await send()}catch(e){document.getElementById('status').textContent='❌ Không gửi được lệnh / backend cần cập nhật V34B'}}
async function setGroup(group,v){(group==='pet'?petItems:textItems).forEach(([id])=>s[id]=v);render();try{await send()}catch(e){document.getElementById('status').textContent='❌ Không gửi được lệnh / backend cần cập nhật V34B'}}
function basePath(){return location.origin+location.pathname.replace(/control\.html$/,'')}
async function cp(u,msg){try{await navigator.clipboard.writeText(u);document.getElementById('status').textContent=msg}catch(e){prompt('Copy link:',u)}}
function copyPetLink(){cp(basePath()+'index.html?v=34b','📋 Đã copy link Overlay Pet')}
function copyTextLink(){cp(basePath()+'text.html?v=34b','📋 Đã copy link Overlay Chữ')}
</script></body></html>
