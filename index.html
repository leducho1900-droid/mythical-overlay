<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Overlay V33</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(96vw,760px);padding:4px;box-sizing:border-box}
.row{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:0 0 10px 0}.row:last-child{margin-bottom:0}
.card{position:relative;flex:0 0 calc((100% - 20px)/3);max-width:170px;aspect-ratio:355/406;overflow:visible}
.row[data-count="2"] .card{flex-basis:calc((100% - 10px)/2);max-width:170px}.row[data-count="1"] .card{flex-basis:170px;max-width:170px}
.base,.float-wrap,.obj{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}.base,.obj{object-fit:contain}
.float-wrap{transform:translateZ(0);backface-visibility:hidden;perspective:1000px}
.obj{transform-origin:center 69%;will-change:transform;backface-visibility:hidden;transform:translate3d(0,0,0) scale(.97);animation:breathe 3.6s cubic-bezier(.45,.05,.55,.95) infinite}
.card.tiger .obj,.card.yeti .obj{transform-origin:center 72%}
.card.magnet .obj{animation-delay:-.15s}.card.dragon .obj{animation-delay:-.75s}.card.tiger .obj{animation-delay:-1.35s}.card.kitsune .obj{animation-delay:-1.95s}.card.control .obj{animation-delay:-2.55s}.card.yeti .obj{animation-delay:-3.15s}
@keyframes breathe{0%,100%{transform:translate3d(0,0,0) scale(.97)}50%{transform:translate3d(0,-1px,0) scale(1.035)}}
</style></head><body><div id="wrap"></div><script>
const BACKEND_URL='https://mythical-overlay-backend.leducho1900.workers.dev';
const items=[['magnet','magnet_base.png','magnet_obj.png'],['dragon','dragon_base.png','dragon_obj.png'],['tiger','tiger_base.png','tiger_obj.png'],['kitsune','kitsune_base.png','kitsune_obj.png'],['control','control_base.png','control_obj.png'],['yeti','yeti_base.png','yeti_obj.png']];
let state={magnet:true,dragon:true,tiger:true,kitsune:true,control:true,yeti:true,text_3in1:false,text_4in1:false,text_5in1:false,text_6in1:false};
function splitVisible(arr){const n=arr.length;if(n<=0)return[];if(n===1)return[arr];if(n===2)return[arr];if(n===3)return[arr.slice(0,2),arr.slice(2,3)];if(n===4)return[arr.slice(0,2),arr.slice(2,4)];if(n===5)return[arr.slice(0,3),arr.slice(3,5)];return[arr.slice(0,3),arr.slice(3,6)]}
function render(){const wrap=document.getElementById('wrap');const visible=items.filter(([id])=>state[id]);const rows=splitVisible(visible);wrap.innerHTML='';rows.forEach(group=>{const row=document.createElement('div');row.className='row';row.dataset.count=String(group.length);group.forEach(([id,b,o])=>{const card=document.createElement('div');card.className='card '+id;const base=document.createElement('img');base.className='base';base.src=b+'?v=33';const fw=document.createElement('div');fw.className='float-wrap';const obj=document.createElement('img');obj.className='obj';obj.src=o+'?v=33';fw.appendChild(obj);card.append(base,fw);row.appendChild(card)});wrap.appendChild(row)})}
async function sync(){try{const r=await fetch(BACKEND_URL+'/state?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const x=await r.json();if(x&&x.state){const next={...state,...x.state};const changed=items.some(([id])=>next[id]!==state[id]);state=next;if(changed)render()}}catch(e){}}
render();sync();setInterval(sync,900);
</script></body></html>
