<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Key V51</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;padding:18px}.wrap{max-width:900px;margin:auto}.box{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 180px auto;gap:8px}.grid input,.grid select{background:#101010;color:#fff;border:1px solid #444;border-radius:9px;padding:11px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.blue{background:#0a84ff;color:#fff}.green{background:#31d158}.red{background:#ff453a;color:#fff}.gray{background:#555;color:#fff}.purple{background:#bf5af2;color:#fff}.keycard{background:#202020;border-radius:12px;padding:12px;margin:9px 0}.top{display:flex;justify-content:space-between;gap:10px}.meta{color:#aaa;font-size:13px;line-height:1.5;margin-top:6px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.newkey{font-family:monospace;font-size:18px;color:#7ee7ff;word-break:break-all}.bad{color:#ff8a80}.ok{color:#7dff97}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>👑 Quản lý Key V51</h1><div class="box">Nhập CONTROL_KEY của chủ web<input id="adminKey" type="password" placeholder="Admin key" style="width:100%;margin:8px 0;padding:11px;background:#101010;color:#fff;border:1px solid #444;border-radius:9px"><button class="btn blue" onclick="loadKeys()">Đăng nhập Admin</button></div><div id="panel" style="display:none"><div class="box"><h3>Tạo key mới</h3><div class="grid"><input id="label" placeholder="Tên người dùng"><select id="duration"><option value="null">Vĩnh viễn</option><option value="24">24 giờ</option><option value="168">7 ngày</option><option value="720">30 ngày</option></select><button class="btn green" onclick="createKey()">+ Tạo key</button></div><div id="created" class="newkey" style="margin-top:12px"></div></div><div class="box"><div class="top"><h3 style="margin:0">Danh sách key</h3><button class="btn gray" onclick="loadKeys()">Làm mới</button></div><div id="keys"></div></div></div><div id="status"></div></div><script>
const BACKEND_URL='https://mythical-overlay-backend.leducho1900.workers.dev';let admin='';function fmt(t){return t?new Date(t).toLocaleString('vi-VN'):'Vĩnh viễn'}function hdr(){return {'Content-Type':'application/json','X-Control-Key':admin}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadKeys(){admin=document.getElementById('adminKey').value.trim()||admin;if(!admin)return;try{const r=await fetch(BACKEND_URL+'/admin/keys',{headers:hdr()});const d=await r.json();if(!r.ok)throw 0;document.getElementById('panel').style.display='block';document.getElementById('status').textContent='✅ Admin OK';render(d.keys||[])}catch(e){document.getElementById('status').textContent='❌ Sai admin key hoặc Worker chưa cập nhật'}}function render(a){document.getElementById('keys').innerHTML=a.length?a.map(x=>`<div class="keycard"><div class="top"><b>${esc(x.label)}</b><span class="${x.revoked?'bad':'ok'}">${x.revoked?'ĐÃ KHÓA':'HOẠT ĐỘNG'}</span></div><div class="meta">Key: ••••-${x.keyHint}<br>Thiết bị: ${x.deviceBound?'Đã kích hoạt':'Chưa kích hoạt'}<br>Hết hạn: ${fmt(x.expiresAt)}<br>Room: ${x.room}</div><div class="actions"><button class="btn blue" onclick="act('reset-device','${x.id}')">Reset thiết bị</button><button class="btn purple" onclick="act('toggle-revoke','${x.id}')">${x.revoked?'Mở khóa':'Khóa key'}</button><button class="btn red" onclick="act('delete','${x.id}')">Xóa key</button></div></div>`).join(''):'Chưa có key nào.'}async function createKey(){const label=document.getElementById('label').value.trim()||'User';const v=document.getElementById('duration').value;const hours=v==='null'?null:Number(v);try{const r=await fetch(BACKEND_URL+'/admin/create',{method:'POST',headers:hdr(),body:JSON.stringify({label,hours})});const d=await r.json();if(!r.ok)throw 0;document.getElementById('created').innerHTML=`KEY MỚI: <b>${d.key}</b><br><button class="btn blue" id="copyNew">Copy key</button><div style="font-family:Arial;font-size:13px;color:#aaa;margin-top:6px">Key đầy đủ chỉ hiện lúc vừa tạo.</div>`;document.getElementById('copyNew').onclick=()=>navigator.clipboard.writeText(d.key);await loadKeys()}catch(e){document.getElementById('status').textContent='❌ Không tạo được key'}}async function act(action,id){if(action==='delete'&&!confirm('Xóa key này?'))return;try{const r=await fetch(BACKEND_URL+'/admin/'+action,{method:'POST',headers:hdr(),body:JSON.stringify({id})});if(!r.ok)throw 0;await loadKeys()}catch(e){document.getElementById('status').textContent='❌ Thao tác thất bại'}}</script></body></html>
