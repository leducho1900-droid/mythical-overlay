<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Overlay Control</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:18px}.wrap{max-width:620px;margin:auto}h1{margin:0 0 6px;font-size:25px}p{color:#bbb}.row{display:flex;align-items:center;justify-content:space-between;background:#202020;border-radius:12px;padding:12px 14px;margin:9px 0}.name{font-weight:700}.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer}.on{background:#31d158;color:#061007}.off{background:#ff453a;color:#fff}.all{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.copy{background:#0a84ff;color:#fff}.link{background:#191919;border:1px solid #333;padding:10px;border-radius:9px;word-break:break-all;color:#9ecbff;font-size:13px;margin-top:8px}.hint{font-size:13px;line-height:1.5}</style></head><body><div class="wrap"><h1>🎛 Mythical Overlay Control</h1><p>Bật/tắt từng thẻ. Overlay trong TikTok Studio sẽ cập nhật tự động.</p><div id="controls"></div><div class="all"><button class="btn on" onclick="setAll(true)">Bật tất cả</button><button class="btn off" onclick="setAll(false)">Tắt tất cả</button><button class="btn copy" onclick="copyLink()">📋 Copy Overlay Link</button></div><div class="link" id="link"></div><p class="hint">Cách dùng: đưa <b>overlay link</b> vào Browser/Webpage Source trong TikTok Studio. Mở trang <b>control.html</b> riêng để bấm bật/tắt.</p></div>
<script>
const KEY='mythical-overlay-state-v1';const items=[['magnet','🧲 Mythical Magnet'],['dragon','🐉 Mythical Dragon'],['kitsune','🦊 Mythical Kitsune'],['control','🔵 Mythical Control']];const def={magnet:true,dragon:true,kitsune:true,control:true};
function state(){try{return {...def,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...def}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));if('BroadcastChannel' in window){new BroadcastChannel(KEY).postMessage(s)}}
function render(){const s=state();document.getElementById('controls').innerHTML=items.map(([id,n])=>`<div class="row"><span class="name">${n}</span><button class="btn ${s[id]?'on':'off'}" onclick="toggle('${id}')">${s[id]?'ĐANG BẬT':'ĐANG TẮT'}</button></div>`).join('');document.getElementById('link').textContent=location.href.replace(/control\.html(?:\?.*)?$/,'index.html')}
function toggle(id){const s=state();s[id]=!s[id];save(s);render()}function setAll(v){const s={magnet:v,dragon:v,kitsune:v,control:v};save(s);render()}async function copyLink(){const u=location.href.replace(/control\.html(?:\?.*)?$/,'index.html');try{await navigator.clipboard.writeText(u);alert('Đã copy link overlay!')}catch(e){prompt('Copy link này:',u)}}render();setInterval(render,500);
</script></body></html>
