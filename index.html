<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythical Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(96vw,760px);padding:4px;box-sizing:border-box}
.row{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:0 0 10px 0}
.row:last-child{margin-bottom:0}
.card{position:relative;flex:0 0 calc((100% - 20px)/3);max-width:170px;aspect-ratio:355/406;overflow:visible}
.row[data-count="2"] .card{flex-basis:calc((100% - 10px)/2);max-width:170px}
.row[data-count="1"] .card{flex-basis:170px;max-width:170px}
.base,.float-wrap,.obj{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.base,.obj{object-fit:contain}
.base{z-index:1}
.float-wrap{z-index:2;will-change:transform;animation:floatY var(--floatDur,2.7s) cubic-bezier(.45,.05,.55,.95) infinite alternate}
.obj{transform-origin:center var(--originY,70%);will-change:transform;animation:drift var(--driftDur,3.9s) cubic-bezier(.42,0,.58,1) infinite alternate;transform:translate(var(--tx,0px),var(--ty,0px)) scale(var(--scale,1))}
.card.magnet{--originY:68%;--scale:1.01;--ty:-1px;--floatDur:2.6s;--driftDur:3.8s}
.card.dragon{--originY:69%;--scale:1.01;--ty:-1px;--floatDur:2.8s;--driftDur:3.7s}
.card.kitsune{--originY:70%;--scale:1.02;--ty:-1px;--floatDur:2.55s;--driftDur:3.9s}
.card.control{--originY:70%;--scale:1.02;--ty:-1px;--floatDur:2.7s;--driftDur:3.85s}
.card.tiger{--originY:72%;--scale:1.12;--ty:-8px;--floatDur:2.65s;--driftDur:3.8s}
.card.yeti{--originY:72%;--scale:1.16;--ty:-8px;--floatDur:2.75s;--driftDur:3.9s}
.card.magnet .float-wrap{animation-delay:0s}.card.magnet .obj{animation-delay:.1s}
.card.dragon .float-wrap{animation-delay:.35s}.card.dragon .obj{animation-delay:.5s}
.card.tiger .float-wrap{animation-delay:.52s}.card.tiger .obj{animation-delay:.35s}
.card.kitsune .float-wrap{animation-delay:.75s}.card.kitsune .obj{animation-delay:.2s}
.card.control .float-wrap{animation-delay:.18s}.card.control .obj{animation-delay:.65s}
.card.yeti .float-wrap{animation-delay:.9s}.card.yeti .obj{animation-delay:.8s}
@keyframes floatY{0%{transform:translateY(1px)}100%{transform:translateY(-2px)}}
@keyframes drift{0%{transform:translate(var(--tx,0px),var(--ty,0px)) rotate(-.25deg) scale(var(--scale,1))}50%{transform:translate(calc(var(--tx,0px) + .4px),calc(var(--ty,0px) - .6px)) rotate(0deg) scale(calc(var(--scale,1) * 1.004))}100%{transform:translate(calc(var(--tx,0px) + .8px),calc(var(--ty,0px) - 1px)) rotate(.25deg) scale(calc(var(--scale,1) * 1.008))}}
</style>
</head>
<body>
<div id="wrap"></div>
<script>
const TOPIC='mythical-overlay-7f4c9d2a8b6e1c53';
const items=[['magnet','magnet_base.png','magnet_obj.png'],['dragon','dragon_base.png','dragon_obj.png'],['tiger','tiger_base.png','tiger_obj.png'],['kitsune','kitsune_base.png','kitsune_obj.png'],['control','control_base.png','control_obj.png'],['yeti','yeti_base.png','yeti_obj.png']];
let state={magnet:true,dragon:true,tiger:true,kitsune:true,control:true,yeti:true};
const aliases={image1:'tiger',anh1:'tiger',new1:'tiger',fox:'tiger',image2:'yeti',anh2:'yeti',new2:'yeti',frost:'yeti'};
function splitVisible(arr){
  const n=arr.length;
  if(n<=0) return [];
  if(n===1) return [arr];
  if(n===2) return [arr];
  if(n===3) return [arr.slice(0,2),arr.slice(2,3)];
  if(n===4) return [arr.slice(0,2),arr.slice(2,4)];
  if(n===5) return [arr.slice(0,3),arr.slice(3,5)];
  return [arr.slice(0,3),arr.slice(3,6)];
}
function render(){
  const wrap=document.getElementById('wrap');
  const visible=items.filter(([id])=>state[id]);
  const rows=splitVisible(visible);
  wrap.innerHTML='';
  rows.forEach(group=>{
    const row=document.createElement('div');
    row.className='row';
    row.dataset.count=String(group.length);
    group.forEach(([id,baseSrc,objSrc])=>{
      const card=document.createElement('div');
      card.className='card '+id;
      const base=document.createElement('img');
      base.className='base';
      base.src=baseSrc+'?v=25';
      const floatWrap=document.createElement('div');
      floatWrap.className='float-wrap';
      const obj=document.createElement('img');
      obj.className='obj';
      obj.src=objSrc+'?v=25';
      floatWrap.appendChild(obj);
      card.appendChild(base);
      card.appendChild(floatWrap);
      row.appendChild(card);
    });
    wrap.appendChild(row);
  });
}
function normalizePayload(x){const out={};Object.keys(x||{}).forEach(k=>{out[aliases[k]||k]=x[k];});return out;}
function apply(x){try{x=JSON.parse(x);if(x&&typeof x==='object'){state={...state,...normalizePayload(x)};render();}}catch(e){}}
try{
  const es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event==='message')apply(d.message)}catch(err){}};
}catch(e){}
render();
</script>
</body></html>
