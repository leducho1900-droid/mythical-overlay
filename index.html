<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Overlay</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;align-content:start;justify-content:center;padding:8px;box-sizing:border-box}#grid img{width:100%;max-width:430px;height:auto;display:block;justify-self:center;object-fit:contain}@media(max-width:700px){#grid{grid-template-columns:1fr}}</style></head><body><div id="grid"></div><script>
const KEY='mythical-overlay-state-v1';
const items=[['magnet','magnet.png'],['dragon','dragon.png'],['kitsune','kitsune.png'],['control','control.png']];
const defaultState={magnet:true,dragon:true,kitsune:true,control:true};
function getState(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return defaultState}}
function render(){const s=getState();const g=document.getElementById('grid');g.innerHTML='';items.forEach(([id,file])=>{if(s[id]){const im=document.createElement('img');im.src=file;im.dataset.id=id;g.appendChild(im)}})}
window.addEventListener('storage',e=>{if(e.key===KEY)render()});
if('BroadcastChannel' in window){const ch=new BroadcastChannel(KEY);ch.onmessage=render}
setInterval(render,500);render();
</script></body></html>
